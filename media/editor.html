<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}; img-src {{cspSource}} data:; font-src {{cspSource}};"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{iconsUri}}" rel="stylesheet" />
    <link href="{{cssUri}}" rel="stylesheet" />
    <title>Quick Cmd</title>
  </head>
  <body>
    <div id="empty" class="empty-state">
      <span data-icon="list" class="empty-icon" aria-hidden="true"></span>
      <strong data-i18n="Select a command to edit"></strong>
      <p data-i18n="Select a command in the list, or create one below."></p>
      <button
        type="button"
        id="new"
        class="primary"
        data-i18n="New command"
      ></button>
    </div>
    <form id="form" novalidate hidden>
      <header class="editor-header">
        <div id="context" class="context"></div>
        <button
          type="button"
          id="expand"
          class="icon-button"
          data-label="Open wide editor"
          data-icon="expand"
        ></button>
        <button
          type="button"
          id="reopen"
          class="icon-button"
          data-label="Reopen saved version"
          data-icon="reload"
        ></button>
      </header>
      <main>
        <fieldset id="editorFields">
          <section class="field">
            <label for="title" data-i18n="Command name"></label>
            <input
              id="title"
              maxlength="128"
              autocomplete="off"
              required
              aria-required="true"
              aria-describedby="titleError"
              data-placeholder="For example: Build project"
            />
            <p id="titleError" class="field-error" role="alert" hidden></p>
          </section>
          <section class="steps-section" aria-labelledby="stepsHeading">
            <div class="section-heading">
              <h2 id="stepsHeading" data-i18n="Command steps"></h2>
              <span id="stepCount" class="muted"></span>
            </div>
            <div id="steps" class="steps-list"></div>
            <button type="button" id="addStep" class="add-step">
              <span data-icon="add" aria-hidden="true"></span
              ><span data-i18n="Add step"></span>
            </button>
            <p id="stepsError" class="field-error" role="alert" hidden></p>
            <div id="stepUndo" class="undo-row" hidden>
              <span data-i18n="Step deleted."></span
              ><button
                type="button"
                id="undo"
                class="text-button"
                data-i18n="Undo"
              ></button>
            </div>
            <label class="check"
              ><input type="checkbox" id="trailingEnter" checked /><span
                data-i18n="Send trailing Enter"
              ></span
            ></label>
            <p id="enterHint" class="field-hint" aria-live="polite"></p>
            <p class="hint">
              <span data-icon="info" aria-hidden="true"></span
              ><span
                data-i18n="Steps are joined with newlines and sent together. They do not wait for completion or stop on failure. Embedded newlines may execute commands even without a trailing Enter."
              ></span>
            </p>
          </section>
          <section class="field">
            <label for="cwd" data-i18n="Working directory"></label>
            <input
              id="cwd"
              maxlength="2048"
              autocomplete="off"
              data-placeholder="Default: current workspace folder"
            />
            <div class="variable-chips">
              <button
                type="button"
                class="variable-chip"
                data-cwd="${workspaceFolder}"
              >
                ${workspaceFolder}</button
              ><button
                type="button"
                class="variable-chip"
                data-cwd="${fileDirname}"
              >
                ${fileDirname}
              </button>
            </div>
            <p id="cwdError" class="field-error" role="alert" hidden></p>
          </section>
          <section class="field">
            <label for="terminal" data-i18n="Terminal usage"></label>
            <select id="terminal">
              <option value="new" data-i18n="New terminal each time"></option>
              <option
                value="reuse"
                data-i18n="Prefer an idle dedicated terminal"
              ></option>
              <option
                value="active"
                data-i18n="Use the active terminal"
              ></option>
            </select>
            <p
              id="terminalHint"
              class="field-hint"
              data-i18n="The active terminal uses its existing directory and environment."
              hidden
            ></p>
          </section>
          <details id="advanced" class="advanced" open>
            <summary>
              <span data-i18n="Advanced settings"></span
              ><span data-icon="chevron" aria-hidden="true"></span>
            </summary>
            <div class="advanced-content">
              <label class="check"
                ><input type="checkbox" id="confirm" /><span
                  data-i18n="Confirm before sending to terminal"
                ></span
              ></label>
              <section class="field">
                <label for="description" data-i18n="Description"></label
                ><input
                  id="description"
                  maxlength="512"
                  data-placeholder="Optional description"
                />
              </section>
              <section class="field">
                <label id="iconLabel" data-i18n="Command icon"></label>
                <div
                  id="iconPicker"
                  class="icon-picker"
                  role="group"
                  aria-labelledby="iconLabel"
                ></div>
                <input
                  id="icon"
                  maxlength="80"
                  data-placeholder="Custom icon"
                  aria-labelledby="iconLabel"
                  aria-describedby="iconError"
                />
                <p id="iconError" class="field-error" role="alert" hidden></p>
              </section>
              <section class="field">
                <div class="section-heading">
                  <label for="env" data-i18n="Environment variables"></label
                  ><button
                    type="button"
                    id="envMode"
                    class="text-button"
                    data-i18n="Edit as JSON"
                  ></button>
                </div>
                <div id="envTable"></div>
                <button
                  type="button"
                  id="addEnv"
                  class="secondary"
                  data-i18n="Add variable"
                ></button>
                <textarea
                  id="env"
                  rows="4"
                  spellcheck="false"
                  aria-describedby="envError"
                  hidden
                >
{}</textarea>
                <p id="envError" class="field-error" role="alert" hidden></p>
              </section>
            </div>
          </details>
        </fieldset>
      </main>
      <footer class="save-area">
        <p
          id="readOnlyHint"
          class="field-hint"
          data-i18n="Editing in the wide editor."
          hidden
        ></p>
        <div
          id="saveState"
          class="save-state"
          role="status"
          aria-live="polite"
        ></div>
        <p id="error" class="field-error" role="alert" hidden></p>
        <div class="save-actions">
          <button type="submit" id="save" class="primary">
            <span data-icon="save" aria-hidden="true"></span
            ><span data-i18n="Save command"></span></button
          ><button type="button" id="saveRun" class="secondary">
            <span data-icon="play" aria-hidden="true"></span
            ><span data-i18n="Save and send"></span>
          </button>
        </div>
      </footer>
    </form>
    <script src="{{i18nUri}}" nonce="{{nonce}}"></script>
    <script src="{{jsUri}}" nonce="{{nonce}}"></script>
  </body>
</html>
