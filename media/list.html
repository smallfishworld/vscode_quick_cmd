<!doctype html>
<html lang="{{language}}">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src {{cspSource}}; script-src {{cspSource}}; font-src {{cspSource}};"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="{{iconsUri}}" rel="stylesheet" />
    <link href="{{cssUri}}" rel="stylesheet" />
    <title>Quick Cmd</title>
  </head>
  <body>
    <div id="error" role="alert" hidden></div>
    <div id="empty" hidden>
      <p data-i18n="No commands yet. Create a group to get started."></p>
      <button id="newGroup" type="button" data-i18n="New group"></button>
    </div>
    <div id="list" role="tree" aria-label="Quick Cmd"></div>
    <script src="{{i18nUri}}"></script>
    <script src="{{jsUri}}"></script>
  </body>
</html>
