name: Validate and Package VSIX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test-and-package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check JavaScript syntax
        run: npm run check
      - name: Run unit tests
        run: npm test
      - name: Package VSIX
        run: npx --yes @vscode/vsce package --out quick-cmd.vsix
      - name: Upload installable extension
        uses: actions/upload-artifact@v4
        with:
          name: quick-cmd-vsix
          path: quick-cmd.vsix
