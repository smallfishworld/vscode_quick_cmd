name: Test and Package Quick Cmd
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check and test
        run: |
          npm run check
          npm test
      - name: Build and verify single multilingual installer
        run: |
          npm run package
          python3 scripts/verify-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: quick-cmd-multilingual-vsix
          path: |
            dist/quick-cmd-v*.vsix
            dist/SHA256SUMS
          if-no-files-found: error
