name: Release Quick Cmd
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'package*.json'
      - 'src/**'
      - 'media/**'
      - 'scripts/**'
      - 'test/**'
      - '.github/workflows/release.yml'
permissions:
  contents: write
concurrency:
  group: quick-cmd-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Validate and test
        run: |
          npm run check
          npm test
      - name: Determine version
        id: version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Build and verify both language editions
        run: |
          npm run package
          python3 scripts/verify-packages.py
      - uses: actions/upload-artifact@v4
        with:
          name: quick-cmd-v${{ steps.version.outputs.version }}-bilingual-vsix
          path: |
            dist/*.vsix
            dist/SHA256SUMS
          if-no-files-found: error
      - name: Prepare draft, reset requested history, and publish
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          # Explicit one-time replacement of the inspected 0.7.1 release only.
          # Both installers have passed verification and are archived above.
          if [ "$TAG" = v0.7.1 ]; then
            OLD_ID="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" --jq '.id' 2>/dev/null || true)"
            if [ "$OLD_ID" = 413791301 ]; then
              OLD_TARGET="$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')"
              test "$OLD_TARGET" = a9bc0c492691435170fee1507ae935a348d0d9b7
              test "$GITHUB_SHA" != "$OLD_TARGET"
              gh release delete "$TAG" --yes --cleanup-tag
            fi
          fi
          if gh release view "$TAG" --json isDraft >/dev/null 2>&1; then
            DRAFT="$(gh release view "$TAG" --json isDraft --jq '.isDraft')"
            if [ "$DRAFT" = false ]; then
              echo "$TAG is already published; leaving published assets unchanged."
              exit 0
            fi
            TARGET="$(gh release view "$TAG" --json targetCommitish --jq '.targetCommitish')"
            test "$TARGET" = "$GITHUB_SHA"
            gh release upload "$TAG" dist/*.vsix dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.vsix dist/SHA256SUMS \
              --draft --target "$GITHUB_SHA" --title "Quick Cmd $TAG" \
              --notes-file RELEASE_NOTES.md
          fi
          # One-time reset explicitly requested for 0.6.0. The allowlist is the
          # complete release/tag history inspected before this change; future
          # versions and unrelated tags are never selected for deletion.
          if [ "$TAG" = v0.6.0 ]; then
            for OLD_TAG in v0.2.0 v0.3.0 v0.3.1 v0.4.0 v0.5.0; do
              if gh release view "$OLD_TAG" >/dev/null 2>&1; then
                gh release delete "$OLD_TAG" --yes --cleanup-tag
              fi
            done
          fi
          gh release edit "$TAG" --draft=false --latest
